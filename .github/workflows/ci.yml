# This repo owns this file (first copied from zeitlinb/harness templates/ci.yml).
# GitHub runs nothing automatically (rules E5–E7 in AGENTS.md). This is one job, the repo's verify
# command, for a deliberate manual run only: workflow_dispatch, no push, pull_request or schedule.
name: ci

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backstop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm check-types && pnpm build
