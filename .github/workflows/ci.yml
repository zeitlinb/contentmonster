# bz:config — written by `bz-config apply` from @bz/config (harness). Edit the template there, not here.
# No workflow runs on GitHub automatically (orders E5–E8 in AGENTS.md). Verification runs on this
# Mac at the code-ready head (pstack). This is ONE job, `pnpm verify`, for a deliberate manual run
# only: workflow_dispatch, no push / pull_request / schedule trigger.
name: ci

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backstop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm check-types && pnpm build
