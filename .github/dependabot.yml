# This repo owns this file (first copied from zeitlinb/harness templates/dependabot.yml).
# Weekly, grouped. ci.yml has no pull_request trigger, so a Dependabot PR spends no CI minutes.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
